[phases.setup]
nixPkgs = ["ffmpeg", "python3", "curl", "fontconfig"]

[phases.install]
cmds = [
  "npm install",
  "curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp",
  "chmod a+rx /usr/local/bin/yt-dlp",
  "mkdir -p /usr/share/fonts/custom",
  "curl -L 'https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat-Bold.ttf' -o /usr/share/fonts/custom/Montserrat-Bold.ttf",
  "curl -L 'https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf' -o /usr/share/fonts/custom/Poppins-Bold.ttf",
  "curl -L 'https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf' -o /usr/share/fonts/custom/Anton-Regular.ttf",
  "fc-cache -fv"
]

[start]
cmd = "node src/index.js"
